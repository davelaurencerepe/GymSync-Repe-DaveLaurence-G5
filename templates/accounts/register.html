<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - GymSync</title>
</head>
<body>
    <h2>Create a GymSync Account</h2>
    
    {% if messages %}
        {% for message in messages %}
            <p class="{% if 'success' in message.tags %}text-success{% else %}text-error{% endif %}">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>

    <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
</body>
</html>
