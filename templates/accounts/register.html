<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - GymSync</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #334155;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            max-width: 520px;
            width: 100%;
            padding: 2.5rem 2rem;
        }
        .brand-badge {
            width: 60px;
            height: 60px;
            background: #0f172a;
            color: #38bdf8;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            box-shadow: 0 6px 15px rgba(56, 189, 248, 0.25);
        }
        /* Professional styling for Django's form.as_p */
        form p {
            margin-bottom: 1.15rem;
        }
        form label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.35rem;
            text-transform: capitalize;
        }
        form input[type="text"],
        form input[type="password"],
        form input[type="email"],
        form input[type="tel"],
        form input[type="file"],
        form select {
            width: 100%;
            padding: 0.65rem 0.9rem;
            font-size: 0.95rem;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
            color: #0f172a;
            transition: all 0.2s ease;
        }
        form input:focus, form select:focus {
            outline: none;
            border-color: #0284c7;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        .helptext {
            display: block;
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.3rem;
            line-height: 1.3;
        }
        .errorlist {
            list-style: none;
            padding: 0;
            margin: 0.35rem 0 0 0;
            color: #dc2626;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .btn-register {
            background-color: #0284c7;
            border: none;
            font-weight: 600;
            letter-spacing: 0.3px;
            padding: 0.75rem;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .btn-register:hover {
            background-color: #0369a1;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="brand-badge">
                <i class="bi bi-lightning-charge-fill fs-2"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Create an Account</h3>
            <p class="text-muted small">Join GymSync for easy and organized gym management</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if 'success' in message.tags %}success{% else %}danger{% endif %} alert-dismissible fade show py-2 small" role="alert">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi {% if 'success' in message.tags %}bi-check-circle-fill{% else %}bi-exclamation-triangle-fill{% endif %}"></i>
                        <div>{{ message }}</div>
                    </div>
                    <button type="button" class="btn-close small" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary btn-register text-white w-100 mt-3 shadow-sm">
                <i class="bi bi-person-plus-fill me-1"></i> Register Account
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <p class="text-muted small mb-0">
                Already have an account? 
                <a href="{% url 'login' %}" class="fw-semibold text-primary text-decoration-none">Login here</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
