{% extends "payments/base.html" %}
{% block title %}{{ title }} - GymSync{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="table-card p-4">
            <h4 class="fw-bold mb-3 border-bottom pb-2">
                <i class="bi bi-cash-coin text-warning me-2"></i>{{ title }}
            </h4>

            {% if form.errors %}
                <div class="alert alert-danger py-2 small" role="alert">
                    <i class="bi bi-exclamation-circle-fill me-1"></i>
                    Please fix the errors below and try again.
                </div>
            {% endif %}

            <form method="POST" novalidate class="styled-form">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-flex align-items-center gap-2 mt-4 pt-2 border-top">
                    <button type="submit" class="btn btn-primary px-4 fw-semibold">
                        <i class="bi bi-check-circle me-1"></i> Save Payment
                    </button>
                    <a href="{% url 'payments:list' %}" class="btn btn-outline-secondary px-3">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
